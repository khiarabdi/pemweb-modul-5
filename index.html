<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca - Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Warna Merah */
        .bg-custom-red {
            background-color: #dc3545 !important;
        }
        .btn-custom-red {
            background-color: #dc3545 !important;
            color: #ffffff !important;
            border: none;
        }
        .btn-custom-red:hover {
            background-color: #bb2d3b !important;
            color: #ffffff !important;
        }
        .text-custom-red {
            color: #dc3545 !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-red px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4 text-white" href="#">Ruang Baca</a>
            
            <!-- Tombol Hamburger Toggler untuk Tampilan Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menu Navigasi -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-lg-3 mt-2 mt-lg-0 text-start">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Bantuan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content / Form Login Card -->
    <main class="container my-4 my-sm-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        <h3 class="text-center fw-bold text-dark mb-2">Masuk ke Ruang Baca</h3>
                        <p class="text-center text-muted small mb-4">Temukan bacaan untuk hari ini.</p>
                        
                        <form>
                            <!-- Input Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label text-secondary fw-semibold small">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
                            </div>
                            
                            <!-- Input Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label text-secondary fw-semibold small">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
                            </div>
                            
                            <!-- Checkbox Ingat Saya -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label text-secondary small" for="rememberMe">Ingat saya</label>
                            </div>
                            
                            <!-- Tombol Masuk -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-custom-red py-2 fw-semibold">Masuk</button>
                            </div>
                        </form>
                    </div>
                    
                    <!-- Footer Lupa Password dengan Garis Pembatas -->
                    <div class="card-footer bg-light border-top text-center py-3">
                        <a href="#" class="text-custom-red text-decoration-underline small fw-semibold">Lupa password?</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
